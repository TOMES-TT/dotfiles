theme = "base16_transparent_modified"

[editor]

shell = ["fish", "-c"]
line-number = "relative"
bufferline = "multiple"
color-modes = true

[editor.cursor-shape]
normal = "block"
insert = "block"
select = "underline"

[editor.soft-wrap]
enable = true

[editor.statusline]
right = ["diagnostics", "selections", "register", "position", "primary-selection-length", "file-encoding"]

[editor.smart-tab]
enable = false

[keys.normal]
p = "move_char_left"
P = "swap_view_left"
n = "move_visual_line_down"
N = "join_selections"
e = "move_visual_line_up"
E = "keep_selections"
a = "move_char_right"
A = "swap_view_right"
l = "search_next"
L = "search_prev"
k = "move_next_word_end"
K = "move_next_long_word_end"
j = "append_mode"
J = "insert_at_line_end"
h = "paste_after"
H = "paste_before"
# j = "yank"
# J = "yank_main_selection_to_clipboard"
# y = "insert_mode"
# Y = "insert_at_line_start"

[keys.normal.z]
n = "scroll_down"
e = "scroll_up"
l = "search_next"
L = "search_prev"
o = "align_view_top"

[keys.normal.Z]
n = "scroll_down"
e = "scroll_up"
l = "search_next"
L = "search_prev"
o = "align_view_top"

# [keys.normal.h]
# h = "match_brackets"
# s = "surround_add"
# r = "surround_replace"
# d = "surround_delete"
# a = "select_textobject_around"
# i = "select_textobject_inner"

[keys.normal.g]
p = "goto_line_start"
n = "move_line_down"
e = "move_line_up"
a = "goto_line_end"
k = "goto_last_line"

[keys.normal.C-w]
p = "jump_view_left"
C-p = "jump_view_left"
n = "jump_view_down"
C-n = "jump_view_down"
e = "jump_view_up"
C-e = "jump_view_up"
a = "jump_view_right"
C-a = "jump_view_right"
P = "swap_view_left"
N = "swap_view_down"
E = "swap_view_up"
A = "swap_view_right"

[keys.normal.space]
# j = "yank_to_clipboard"
# J = "yank_main_selection_to_clipboard"
# y = "jumplist_picker"

[keys.select]
p = "move_char_left"
P = "swap_view_left"
n = "move_visual_line_down"
N = "join_selections"
e = "move_visual_line_up"
E = "keep_selections"
a = "move_char_right"
A = "swap_view_right"
l = "search_next"
L = "search_prev"
k = "move_next_word_end"
K = "move_next_long_word_end"
j = "yank"
J = "yank_main_selection_to_clipboard"
y = "insert_mode"
Y = "insert_at_line_start"

[keys.select.z]
n = "scroll_down"
e = "scroll_up"
l = "search_next"
L = "search_prev"
o = "align_view_top"

[keys.select.Z]
n = "scroll_down"
e = "scroll_up"
l = "search_next"
L = "search_prev"
o = "align_view_top"

[keys.select.h]
h = "match_brackets"
s = "surround_add"
r = "surround_replace"
d = "surround_delete"
a = "select_textobject_around"
i = "select_textobject_inner"

[keys.select.g]
p = "goto_line_start"
n = "move_line_down"
e = "move_line_up"
a = "goto_line_end"
k = "goto_last_line"

[keys.select.C-w]
p = "jump_view_left"
C-p = "jump_view_left"
n = "jump_view_down"
C-n = "jump_view_down"
e = "jump_view_up"
C-e = "jump_view_up"
a = "jump_view_right"
C-a = "jump_view_right"
P = "swap_view_left"
N = "swap_view_down"
E = "swap_view_up"
A = "swap_view_right"

[keys.select.space]
j = "yank_to_clipboard"
J = "yank_main_selection_to_clipboard"
y = "jumplist_picker"

[keys.insert]
"C-space" = "normal_mode"
C-v = "record_macro"
C-q = "replay_macro"
C-c = "normal_mode"
# "C-Backspace" = "delete_word_backward"
